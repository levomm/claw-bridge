name: Native Android APK

on:
  push:
    branches: [mobile-harness-integration]
    paths:
      - "native/**"
      - "gateway/**"
      - ".gitmodules"
      - ".github/workflows/native-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore stable Android preview signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: claw-bridge-native-debug-keystore-v1

      - name: Ensure Android debug keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=OSX01,C=EE"
          fi

      - name: Install gateway dependencies
        run: npm --prefix gateway ci

      - name: Test gateway
        run: npm --prefix gateway test

      - name: Syntax-check CLAW tool bridges
        run: |
          node --check gateway/claw-tool.mjs
          node --check gateway/telegram-bridge.mjs
          node --check gateway/service-runner.mjs

      - uses: android-actions/setup-android@v3

      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-36" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Test native runtime
        working-directory: native
        run: ./gradlew testOnlineDebugUnitTest --no-daemon

      - name: Build native preview APK
        working-directory: native
        run: ./gradlew assembleOnlineDebug --no-daemon

      - name: Upload native preview APK
        uses: actions/upload-artifact@v4
        with:
          name: claw-bridge-native-v0.6.2-alpha
          path: native/app/build/outputs/apk/online/debug/app-online-debug.apk
          if-no-files-found: error
          retention-days: 30
